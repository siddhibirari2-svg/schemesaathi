app = "schemesaathi"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[env]
  PORT = "8000"
  SCHEMESAATHI_ENV = "production"

[[mounts]]
  source = "schemesaathi_data"
  destination = "/app/data"
